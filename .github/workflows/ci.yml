name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    env:
      CGO_ENABLED: '0'
      GOFLAGS: -mod=readonly
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version: '1.27.x'
          cache-dependency-path: go.sum
      - run: go mod verify
      - run: go build ./...
      - run: go vet ./...
      - run: go test ./...
      - name: Run examples
        run: |
          go run ./examples/basic
          go run ./examples/invoice
          go run ./examples/report

  race:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version: '1.27.x'
          cache-dependency-path: go.sum
      - run: go test -race ./...
        env:
          CGO_ENABLED: '1'
          GOFLAGS: -mod=readonly

  fuzz:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version: '1.27.x'
          cache-dependency-path: go.sum
      - run: make fuzz
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: fuzz-failures
          path: '**/testdata/fuzz/'
